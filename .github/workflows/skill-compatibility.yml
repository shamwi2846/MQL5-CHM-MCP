name: MCP and skill compatibility

on:
  workflow_call:
    inputs:
      peer_ref:
        description: Counterpart branch, tag, or commit to verify
        type: string
        default: main
  workflow_dispatch:
    inputs:
      peer_ref:
        description: Counterpart branch, tag, or commit to verify
        type: string
        default: main

permissions:
  contents: read

jobs:
  resolve-peer:
    name: Resolve the approved skill commit
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.peer.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the approved peer record
        id: peer
        shell: pwsh
        env:
          EXPECTED_PEER: ${{ github.repository_owner }}/MQL5-Coding-Skill
        run: ./.github/scripts/ReadApprovedPeer.ps1 -RecordPath ./.github/approved-peer.json -ExpectedRepository $env:EXPECTED_PEER
      - name: Test approved peer validation
        shell: pwsh
        run: ./.github/scripts/TestApprovedPeer.ps1
  pair:
    name: Verify the actual MCP and skill pair (${{ matrix.pair }})
    needs: resolve-peer
    strategy:
      fail-fast: false
      matrix:
        pair: [main, approved]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out this revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mcp
          persist-credentials: false

      # The counterpart is public: the job's read-only token (not persisted)
      # fetches it, no secret is needed, and fork pull requests run this check.
      - name: Check out the public counterpart without a secret
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/MQL5-Coding-Skill
          ref: ${{ matrix.pair == 'approved' && needs.resolve-peer.outputs.commit || inputs.peer_ref || 'main' }}
          path: skill
          persist-credentials: false

      - name: Verify the approved checkout identity
        if: matrix.pair == 'approved'
        shell: pwsh
        env:
          EXPECTED_PEER: ${{ github.repository_owner }}/MQL5-Coding-Skill
        run: ./mcp/.github/scripts/ReadApprovedPeer.ps1 -RecordPath ./mcp/.github/approved-peer.json -ExpectedRepository $env:EXPECTED_PEER -PeerRoot ./skill -VersionFile skills/mql5-coding/version.json

      - name: Use Node.js 24.17.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install the hash-pinned skill validator dependency
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r skill/.github/requirements-ci.txt

      - name: Validate the actual skill package and consumer contract
        shell: pwsh
        run: |
          python -B skill/tests/validate_skill.py
          if ($LASTEXITCODE -ne 0) { throw 'Skill package validation failed.' }
          python -B skill/tests/test_mcp_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Skill consumer contract regressions failed.' }

      - name: Install locked MCP dependencies
        working-directory: mcp
        shell: pwsh
        run: npm ci

      - name: Build the actual MCP server
        working-directory: mcp
        shell: pwsh
        run: npm run build:candidate

      - name: Exercise the skill contract against the real stdio server
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          node mcp/scripts/Test-SkillCompatibility.mjs --skill-root skill/skills/mql5-coding --python $pythonPath --report compatibility.json
          if ($LASTEXITCODE -ne 0) { throw 'MCP and skill compatibility failed.' }
          $proof = Get-Content -LiteralPath compatibility.json -Raw | ConvertFrom-Json
          "MCP commit: $($proof.mcp_checkout_commit)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Skill commit: $($proof.skill_checkout_commit)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Passed checks: $($proof.checks.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          node mcp/.github/scripts/CollectPeerEvidence.mjs "$PWD/mcp" "$PWD/skill/skills/mql5-coding" "$PWD/compatibility-identities.json"
          if ($LASTEXITCODE -ne 0) { throw 'Peer identity evidence failed.' }

      - name: Test the environment health command under both PowerShell versions
        shell: pwsh
        run: |
          $env:MQL5_HEALTH_SKILL_ROOT = (Resolve-Path skill/skills/mql5-coding).Path
          $env:MQL5_HEALTH_PYTHON = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          node --test mcp/tests/environment-health.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Environment health regression tests failed.' }

      - name: Retain the verified repository pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mql5-compatibility-${{ matrix.pair }}-${{ github.sha }}
          path: |
            compatibility.json
            compatibility-identities.json
          if-no-files-found: error
          retention-days: 30
