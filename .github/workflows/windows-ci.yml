name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: MCP and skill compatibility
    uses: ./.github/workflows/skill-compatibility.yml
    secrets: inherit

  fast:
    name: Fast and maintenance MCP tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js 24.17.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) {
              throw "Expected PowerShell 7, found $($PSVersionTable.PSVersion)."
          }
          npm ci

      - name: Run fast MCP and cross-shell syntax tests
        shell: pwsh
        run: npm run test:fast

      - name: Run maintenance tests under PowerShell 7
        shell: pwsh
        run: npm run test:maintenance

      - name: Run maintenance tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)."
          }
          & .\scripts\Invoke-PowerShellTestSuite.ps1 -Suite Maintenance

      - name: Test pinned 7-Zip metadata and recovery under PowerShell 7
        shell: pwsh
        run: .\scripts\Test-SevenZipRuntime.ps1

      - name: Test pinned 7-Zip metadata and recovery under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-SevenZipRuntime.ps1
